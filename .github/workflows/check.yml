name: Check

on:
  push:
  pull_request:

jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        if: github.event_name == 'push'
        run: ruby tools/release_version.rb --check
      - name: Build and run unit tests and gameplay scenarios
        run: docker build --target test .
      - name: Run game startup, VNC, save and load test
        run: bash tests/e2e.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v3
      - name: Build Windows game
        run: msbuild RogueSurvivor.sln /p:Configuration=Release '/p:Platform=Any CPU' /verbosity:minimal
      - name: Test Windows package startup
        shell: pwsh
        run: |
          Compress-Archive -Path 'WRogue/bin/Release/*' -DestinationPath windows-ci.zip
          ./tests/windows-startup.ps1 windows-ci.zip
